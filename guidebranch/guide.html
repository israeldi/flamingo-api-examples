  }

  function markdownText(value) {
    return String(value).replace(/\\/g, "\\\\").replace(/([`*_{}\[\]<>#+.!|~-])/g, "\\$1");
  }

  function summaryMarkdown(summary) {
    var lines = ["# " + markdownText(summary.guide.title) + " — path summary", "",
      "Guide: " + markdownText(summary.guide.id), "Version: " + markdownText(summary.guide.version),
      "Audience: " + markdownText(summary.guide.audience), "Owner: " + markdownText(summary.guide.owner),
      "Scope: " + markdownText(summary.guide.scope), "",
      "## Your path", ""];
    if (!summary.path.length) lines.push("No answers recorded yet.", "");
    summary.path.forEach(function (step) {
      lines.push(step.step + ". **" + markdownText(step.question) + "**",
        "   Answer: " + markdownText(step.answer),
        "   Sources: " + step.source_labels.map(markdownText).join("; "), "");
    });
    lines.push("## Current " + (summary.current.kind === "outcome" ? "guidance" : "question"), "",
      "**" + markdownText(summary.current.title) + "**", "",
      "Status: " + markdownText(summary.status === "in_progress" ? "In progress" : OUTCOME_LABELS[summary.status]), "");
    if (summary.current.body) lines.push(markdownText(summary.current.body), "");
    lines.push("Sources: " + summary.current.source_labels.map(markdownText).join("; "), "", "## Guide sources", "");
    summary.guide.sources.forEach(function (source) {
      lines.push("- " + markdownText(source.label) + " · version " + markdownText(source.version));
    });
    lines.push("", "## Review note", "", summary.review_note, "", summary.privacy_note, "");
    return lines.join("\n");
  }

  var api = {
    createState: createState, currentNode: currentNode, choose: choose,
    back: back, restart: restart, jump: jump,
    buildSummary: buildSummary, summaryMarkdown: summaryMarkdown
  };
  root.GuideBranch = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;

  if (!root.document) return;
  var document = root.document;
  var mount = document.getElementById("app");
  var dataElement = document.getElementById("guide-data");
  if (!mount || !dataElement) return;

  function element(tag, className, value) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = String(value);
    return node;
  }

  function icon(kind, className) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");
    if (className) svg.setAttribute("class", className);
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    var paths = {
      arrow: "M4 10h12m-5-5 5 5-5 5",
      back: "M16 10H4m5-5-5 5 5 5",
      restart: "M4.5 6A6.5 6.5 0 1 1 3.8 13M4.5 2v4h4",
      download: "M10 3v9m-4-4 4 4 4-4M4 13v4h12v-4",
      print: "M5 7V3h10v4M5 13H3V7h14v6h-2M5 11h10v6H5z"
    };
    path.setAttribute("d", paths[kind]);
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.4");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
    return svg;
  }

  function labels(list, className) {
    var ul = element("ul", className || "source-labels");
    list.forEach(function (label) { ul.appendChild(element("li", "", label)); });
    return ul;
  }

  function button(className, label, action, iconName) {
    var control = element("button", className);
    control.type = "button";
    if (iconName) control.appendChild(icon(iconName));
    control.appendChild(element("span", "", label));
    control.addEventListener("click", action);
    return control;
  }

  function showError() {
    mount.replaceChildren();
    var box = element("section", "error-box");
    var heading = element("h1", "", "This guide could not be opened");
    heading.tabIndex = -1;
    box.appendChild(heading);
    box.appendChild(element("p", "", "The guide data or path is incomplete. Ask the support owner for a newly reviewed copy. No actions have run and no answers have been sent."));
    mount.appendChild(box);
    heading.focus();
  }

  try {
    var data = JSON.parse(dataElement.textContent);
    var state = createState(data);
    document.title = data.title + " · GuideBranch";

    function navigate(nextState) {
      state = nextState;
      render(true);
    }

    function download(format, status) {
      try {
        var summary = buildSummary(data, state);
        var content = format === "json" ? JSON.stringify(summary, null, 2) + "\n" : summaryMarkdown(summary);
        var blob = new Blob([content], { type: (format === "json" ? "application/json" : "text/markdown") + ";charset=utf-8" });
        var url = root.URL.createObjectURL(blob);
        var anchor = document.createElement("a");
        var fileVersion = String(data.version).replace(/[^a-zA-Z0-9_-]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "version";
        anchor.href = url;
        anchor.download = data.id + "-" + fileVersion + "-summary." + (format === "json" ? "json" : "md");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        root.setTimeout(function () { root.URL.revokeObjectURL(url); }, 1000);
        status.textContent = (format === "json" ? "JSON" : "Markdown") + " summary prepared for download. Nothing was sent.";
      } catch (error) {
        status.textContent = "This browser could not download the summary. Use Print this path to save a local copy.";
      }
    }

    function render(focusHeading) {
      var walked = trace(data, state);
      var current = walked.node;
      var fragment = document.createDocumentFragment();

      var intro = element("section", "intro");
      intro.setAttribute("aria-labelledby", "guide-title");
      intro.appendChild(element("p", "eyebrow", "A clear path through the problem"));
      var guideTitle = element("h1", "", data.title);
      guideTitle.id = "guide-title";
      intro.appendChild(guideTitle);
      intro.appendChild(element("p", "audience", "For " + data.audience));
      var scopeLine = element("p", "scope-line");
      scopeLine.appendChild(element("strong", "", "Scope: "));
      scopeLine.appendChild(document.createTextNode(data.scope));
      intro.appendChild(scopeLine);
      var info = element("details", "guide-info");
      info.appendChild(element("summary", "", "About this guide"));
      var infoContent = element("div", "info-content");
      [["Support owner", data.owner], ["Guide version", data.version]].forEach(function (row) {
        var line = element("p", "info-row");
        line.appendChild(element("strong", "", row[0] + ": "));
        line.appendChild(document.createTextNode(row[1]));
        infoContent.appendChild(line);
      });
      var sourceRow = element("div", "info-row");
      sourceRow.appendChild(element("strong", "", "Guide sources"));
      sourceRow.appendChild(labels(data.sources.map(function (source) { return source.label + " · version " + source.version; }), "info-sources"));
      infoContent.appendChild(sourceRow);
      info.appendChild(infoContent);
      intro.appendChild(info);
      fragment.appendChild(intro);

      var workspace = element("div", "workspace");
      var card = element("section", "current-card");
      card.setAttribute("aria-labelledby", "current-heading");
      if (current.kind === "outcome") card.dataset.outcome = current.outcome;
      card.appendChild(element("div", "card-topline"));
      var cardContent = element("div", "card-content");
      var meta = element("p", "step-meta");
      var stepDot = element("span", "step-dot", current.kind === "question" ? String(state.path.length + 1).padStart(2, "0") : "↳");
      stepDot.setAttribute("aria-hidden", "true");
      meta.appendChild(stepDot);
      meta.appendChild(element("span", "", current.kind === "question" ? "Question " + (state.path.length + 1) : OUTCOME_LABELS[current.outcome]));
      cardContent.appendChild(meta);
      var heading = element("h2", "node-title", current.title);
      heading.id = "current-heading";
      heading.tabIndex = -1;
      cardContent.appendChild(heading);
      if (current.body) cardContent.appendChild(element("p", "node-body", current.body));
      if (current.kind === "question") {
        cardContent.appendChild(element("p", "choice-hint", "Choose the answer that fits."));
        var choiceList = element("div", "choice-list");
        current.choices.forEach(function (choice) {
          var control = element("button", "choice" + (choice.unknown ? " unknown" : ""));
          control.type = "button";
          control.appendChild(element("span", "choice-label", choice.label));
          control.appendChild(icon("arrow", "choice-arrow"));
          control.addEventListener("click", function () { navigate(choose(data, state, choice.id)); });
          choiceList.appendChild(control);
        });
        cardContent.appendChild(choiceList);
      } else {
        cardContent.appendChild(element("p", "guidance-caption", current.outcome === "escalate" ? "You can save the path below and share it with the support owner yourself. Nothing is sent from this guide." : current.outcome === "stop" ? "Pause here and review the guidance with the support owner. Reaching this step does not mean the issue is resolved." : "Review this guidance before acting. Reaching this step does not mean the issue is resolved."));
      }
      var sourceNote = element("div", "source-note");
      sourceNote.appendChild(element("p", "source-heading", "Source for this step"));
      sourceNote.appendChild(labels(current.source_labels));
      cardContent.appendChild(sourceNote);
      card.appendChild(cardContent);
      var controls = element("div", "card-controls no-print");
      var backControl = button("text-button", "Back", function () { navigate(back(data, state)); }, "back");
      backControl.disabled = state.path.length === 0;
      controls.appendChild(backControl);
      var restartControl = button("text-button restart", "Start again", function () { navigate(restart(data)); }, "restart");
      restartControl.disabled = state.path.length === 0;
      controls.appendChild(restartControl);
      card.appendChild(controls);
      workspace.appendChild(card);

      var trailPanel = element("aside", "trail-panel");
      trailPanel.setAttribute("aria-labelledby", "trail-heading");
      var trailTitle = element("h2", "panel-title");
      trailTitle.id = "trail-heading";
      trailTitle.appendChild(element("span", "", "Your path"));
      trailTitle.appendChild(element("span", "answer-count", state.path.length + (state.path.length === 1 ? " answer" : " answers")));
      trailPanel.appendChild(trailTitle);
      if (!state.path.length) {
        var empty = element("div", "empty-trail");
        empty.appendChild(element("strong", "", "Start with one answer."));
        empty.appendChild(element("p", "", "Your choices will appear here. You can return to any earlier step."));
        trailPanel.appendChild(empty);
      } else {
        trailPanel.appendChild(element("p", "trail-intro", "Revisit a step to change your answer. Later answers will be cleared."));
        var trail = element("ol", "trail-list");
        walked.steps.forEach(function (step, index) {
          var item = element("li", "trail-item");
          var number = element("span", "trail-number", index + 1);
          number.setAttribute("aria-hidden", "true");
          item.appendChild(number);
          var changeControl = element("button", "trail-button");
          changeControl.type = "button";
          changeControl.setAttribute("aria-label", "Change answer to question " + (index + 1) + ": " + step.node.title + " Current answer: " + step.choice.label);
          changeControl.appendChild(element("span", "trail-question", step.node.title));
          changeControl.appendChild(element("span", "trail-answer", step.choice.label));
          changeControl.appendChild(element("span", "trail-edit", "Change answer"));
          changeControl.addEventListener("click", function () { navigate(jump(data, state, index)); });
          item.appendChild(changeControl);
          trail.appendChild(item);
        });
        trailPanel.appendChild(trail);
        var currentLabel = element("p", "trail-current");
        currentLabel.appendChild(element("strong", "", current.kind === "question" ? "Now: " : "Reached: "));
        currentLabel.appendChild(document.createTextNode(current.title));
        trailPanel.appendChild(currentLabel);
      }
      var savePanel = element("section", "save-panel no-print");
      savePanel.appendChild(element("h3", "", "Keep a copy"));
      savePanel.appendChild(element("p", "save-description", "Save your answers and current guidance. Nothing is sent from this guide."));
      var status = element("p", "download-status");
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      var downloads = element("div", "download-actions");
      downloads.appendChild(button("download-button", "Markdown", function () { download("markdown", status); }, "download"));
      downloads.appendChild(button("download-button", "JSON", function () { download("json", status); }, "download"));
      savePanel.appendChild(downloads);
      savePanel.appendChild(button("print-button", "Print this path", function () { root.print(); }, "print"));
      savePanel.appendChild(status);
      trailPanel.appendChild(savePanel);
      trailPanel.appendChild(element("p", "print-sources", REVIEW_NOTE + "\nScope: " + data.scope + "\nSupport owner: " + data.owner));
      workspace.appendChild(trailPanel);
      fragment.appendChild(workspace);

      var note = element("p", "review-note");
      note.appendChild(element("strong", "", "Source-linked guidance. "));
      note.appendChild(document.createTextNode(REVIEW_NOTE));
      fragment.appendChild(note);
      var footer = element("footer", "page-footer");
      footer.appendChild(element("p", "version-label", "Guide " + data.id + " · version " + data.version + "\nSupport owner: " + data.owner));
      footer.appendChild(element("p", "footer-local", "Your answers stay in this page.\nNo automatic actions or sending."));
      fragment.appendChild(footer);
      mount.replaceChildren(fragment);
      if (focusHeading) heading.focus();
    }

    render(false);
  } catch (error) {
    showError();
  }
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
</body>
</html>
